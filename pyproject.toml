[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-analysis"
version = "0.1.0"
description = "Python helpers for a C++/ROOT analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "awkward>=2",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "uproot>=5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
plot-analysis-result = "my_analysis.plot_result:main"

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

